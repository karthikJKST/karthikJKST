name: Update GitHub Profile Stats

on:
  schedule:
    # Runs every Sunday at midnight UTC
    - cron: "0 0 * * 0"
  # Also run on push to main branch
  push:
    branches: ["main"]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🏗️ Checkout repository
        uses: actions/checkout@v4

      - name: 📊 Generate GitHub Stats Image
        uses: lowlighter/metrics@latest
        with:
          # You need to add a PAT (classic) with `repo` and `user` scopes
          # as a repository secret named METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

          # Base options
          user: karthikJKST
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_display: regular
          config_order: base.header, base.activity, base.community, base.repositories

          # GitHub commits isocalendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Languages
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_recent.days: 365
          plugin_languages_sections: most-used

          # Habits (coding activity)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          # Lines of code changed
          plugin_lines: yes

          # Follow-up (issue/PR activity)
          plugin_followup: yes
          plugin_followup_sections: repositories

          # Notable contributions
          plugin_notable: yes
          plugin_notable_from: organization

          # Achievements
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 6

          # Output
          filename: github-metrics.svg
          commits_authoring: karthikJKST, karthikshivatejaj@gmail.com

      - name: 📄 Commit and Push Metrics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore: auto-update GitHub metrics [skip ci]"
          git push

  recent-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🏗️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔄 Update Recent GitHub Activity
        uses: jamesgeorge007/github-activity-readme@master
        with:
          COMMIT_MSG: "chore: auto-update recent activity [skip ci]"
          MAX_LINES: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
