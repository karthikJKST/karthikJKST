<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%" style="display: block;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="reqGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="resGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="320" fill="url(#bgGrad)" rx="12"/>

  <!-- Subtle grid -->
  <g stroke="#58a6ff" stroke-width="0.2" opacity="0.03">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
  </g>

  <!-- Connection lines (horizontal) -->
  <g stroke="#30363d" stroke-width="1.5" fill="none">
    <line x1="140" y1="160" x2="260" y2="160"/>
    <line x1="300" y1="160" x2="420" y2="160"/>
    <line x1="460" y1="160" x2="580" y2="160"/>
    <line x1="620" y1="160" x2="740" y2="160"/>
  </g>

  <!-- Animated request packet (Client → Controller) -->
  <circle r="4" fill="#58a6ff" opacity="0.9" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M140,160 L260,160"/>
  </circle>

  <!-- Animated request packet (Controller → Service) -->
  <circle r="4" fill="#58a6ff" opacity="0.8" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0.3s" path="M300,160 L420,160"/>
  </circle>

  <!-- Animated request packet (Service → Repository) -->
  <circle r="4" fill="#58a6ff" opacity="0.7" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0.6s" path="M460,160 L580,160"/>
  </circle>

  <!-- Animated request packet (Repository → Database) -->
  <circle r="4" fill="#58a6ff" opacity="0.6" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0.9s" path="M620,160 L740,160"/>
  </circle>

  <!-- Animated response packet (Database → Repository) -->
  <circle r="3" fill="#3fb950" opacity="0.6" filter="url(#glow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" begin="1.2s" path="M740,160 L620,160"/>
  </circle>

  <!-- Animated response packet (Repository → Service) -->
  <circle r="3" fill="#3fb950" opacity="0.7" filter="url(#glow)">
    <animateMotion dur="2s" repeatCount="indefinite" begin="1.5s" path="M580,160 L460,160"/>
  </circle>

  <!-- Animated response packet (Service → Controller) -->
  <circle r="3" fill="#3fb950" opacity="0.8" filter="url(#glow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" begin="1.8s" path="M420,160 L300,160"/>
  </circle>

  <!-- Animated response packet (Controller → Client) -->
  <circle r="3" fill="#3fb950" opacity="0.9" filter="url(#glow)">
    <animateMotion dur="1.5s" repeatCount="indefinite" begin="2.1s" path="M260,160 L140,160"/>
  </circle>

  <!-- Client node -->
  <g>
    <rect x="60" y="130" width="80" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="100" y="158" text-anchor="middle" fill="#8b949e" font-size="11" font-family="system-ui, -apple-system, sans-serif">Client</text>
    <text x="100" y="172" text-anchor="middle" fill="#58a6ff" font-size="8" font-family="system-ui, -apple-system, sans-serif">Request</text>
  </g>

  <!-- Controller node -->
  <g>
    <rect x="220" y="130" width="80" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="260" y="154" text-anchor="middle" fill="#8b949e" font-size="11" font-family="system-ui, -apple-system, sans-serif">Controller</text>
    <text x="260" y="170" text-anchor="middle" fill="#58a6ff" font-size="8" font-family="system-ui, -apple-system, sans-serif">REST API</text>
  </g>

  <!-- Service node -->
  <g>
    <rect x="380" y="130" width="80" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="420" y="154" text-anchor="middle" fill="#8b949e" font-size="11" font-family="system-ui, -apple-system, sans-serif">Service</text>
    <text x="420" y="170" text-anchor="middle" fill="#58a6ff" font-size="8" font-family="system-ui, -apple-system, sans-serif">Business Logic</text>
  </g>

  <!-- Repository node -->
  <g>
    <rect x="540" y="130" width="80" height="60" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="580" y="154" text-anchor="middle" fill="#8b949e" font-size="11" font-family="system-ui, -apple-system, sans-serif">Repository</text>
    <text x="580" y="170" text-anchor="middle" fill="#58a6ff" font-size="8" font-family="system-ui, -apple-system, sans-serif">JPA / Hibernate</text>
  </g>

  <!-- Database node -->
  <g>
    <ellipse cx="740" cy="140" rx="40" ry="18" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <ellipse cx="740" cy="180" rx="40" ry="18" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect x="700" y="140" width="80" height="40" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="740" y="165" text-anchor="middle" fill="#3fb950" font-size="10" font-family="system-ui, -apple-system, sans-serif">PostgreSQL</text>
    <text x="740" y="195" text-anchor="middle" fill="#8b949e" font-size="8" font-family="system-ui, -apple-system, sans-serif">Database</text>
  </g>

  <!-- Labels -->
  <text x="100" y="230" text-anchor="middle" fill="#8b949e" font-size="9" font-family="system-ui, -apple-system, sans-serif">HTTP</text>
  <text x="260" y="230" text-anchor="middle" fill="#8b949e" font-size="9" font-family="system-ui, -apple-system, sans-serif">@RestController</text>
  <text x="420" y="230" text-anchor="middle" fill="#8b949e" font-size="9" font-family="system-ui, -apple-system, sans-serif">@Service</text>
  <text x="580" y="230" text-anchor="middle" fill="#8b949e" font-size="9" font-family="system-ui, -apple-system, sans-serif">@Repository</text>
  <text x="740" y="230" text-anchor="middle" fill="#8b949e" font-size="9" font-family="system-ui, -apple-system, sans-serif">JDBC</text>

  <!-- Request arrow label -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;3,0;0,0" dur="1.5s" repeatCount="indefinite"/>
    <text x="380" y="145" text-anchor="middle" fill="#58a6ff" font-size="9" font-family="system-ui, -apple-system, sans-serif" opacity="0.8">→ Request</text>
  </g>

  <!-- Response arrow label -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;-3,0;0,0" dur="1.5s" repeatCount="indefinite"/>
    <text x="580" y="180" text-anchor="middle" fill="#3fb950" font-size="9" font-family="system-ui, -apple-system, sans-serif" opacity="0.8">← Response</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="60" y="280" width="680" height="1" fill="url(#reqGrad)" opacity="0.3"/>
</svg>
