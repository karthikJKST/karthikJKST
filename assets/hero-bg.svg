<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="position: absolute; top: 0; left: 0; z-index: 0;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="nodeGlow">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accentGlow">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Network lines -->
  <g stroke="url(#lineGrad)" stroke-width="1" fill="none">
    <line x1="120" y1="80" x2="260" y2="140"/>
    <line x1="260" y1="140" x2="400" y2="100"/>
    <line x1="400" y1="100" x2="520" y2="160"/>
    <line x1="520" y1="160" x2="680" y2="110"/>
    <line x1="120" y1="80" x2="200" y2="220"/>
    <line x1="260" y1="140" x2="320" y2="260"/>
    <line x1="400" y1="100" x2="450" y2="240"/>
    <line x1="520" y1="160" x2="600" y2="280"/>
    <line x1="680" y1="110" x2="720" y2="230"/>
    <line x1="200" y1="220" x2="320" y2="260"/>
    <line x1="320" y1="260" x2="450" y2="240"/>
    <line x1="450" y1="240" x2="600" y2="280"/>
    <line x1="200" y1="220" x2="100" y2="300"/>
    <line x1="320" y1="260" x2="250" y2="340"/>
    <line x1="450" y1="240" x2="500" y2="350"/>
    <line x1="600" y1="280" x2="700" y2="330"/>
    <line x1="100" y1="300" x2="250" y2="340"/>
    <line x1="250" y1="340" x2="500" y2="350"/>
    <line x1="500" y1="350" x2="700" y2="330"/>
  </g>

  <!-- Node glow backgrounds -->
  <circle cx="120" cy="80" r="20" fill="url(#nodeGlow)" filter="url(#blur2)">
    <animate attributeName="r" values="18;24;18" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="100" r="25" fill="url(#accentGlow)" filter="url(#blur2)">
    <animate attributeName="r" values="22;30;22" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="110" r="20" fill="url(#nodeGlow)" filter="url(#blur2)">
    <animate attributeName="r" values="18;24;18" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="340" r="15" fill="url(#nodeGlow)" filter="url(#blur2)">
    <animate attributeName="r" values="14;20;14" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="350" r="15" fill="url(#nodeGlow)" filter="url(#blur2)">
    <animate attributeName="r" values="14;20;14" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Network nodes -->
  <g fill="#58a6ff">
    <circle cx="120" cy="80" r="2.5" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="260" cy="140" r="2" opacity="0.6"/>
    <circle cx="400" cy="100" r="3" fill="#3fb950" opacity="0.9">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="160" r="2" opacity="0.6"/>
    <circle cx="680" cy="110" r="2.5" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="220" r="1.5" opacity="0.5"/>
    <circle cx="320" cy="260" r="2" opacity="0.6"/>
    <circle cx="450" cy="240" r="1.5" opacity="0.5"/>
    <circle cx="600" cy="280" r="2" opacity="0.6"/>
    <circle cx="720" cy="230" r="1.5" opacity="0.5"/>
    <circle cx="100" cy="300" r="1.5" opacity="0.4"/>
    <circle cx="250" cy="340" r="2" opacity="0.7">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="350" r="2" opacity="0.7">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="330" r="1.5" opacity="0.5"/>
  </g>

  <!-- Data flow particles -->
  <circle r="1.5" fill="#58a6ff" opacity="0.6" filter="url(#blur1)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M120,80 L260,140 L400,100 L520,160 L680,110"/>
  </circle>
  <circle r="1" fill="#3fb950" opacity="0.5" filter="url(#blur1)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M400,100 L450,240 L500,350"/>
  </circle>
  <circle r="1" fill="#58a6ff" opacity="0.4" filter="url(#blur1)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M680,110 L720,230 L700,330"/>
  </circle>

  <!-- Subtle grid overlay -->
  <g stroke="#58a6ff" stroke-width="0.3" opacity="0.03">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>
</svg>
