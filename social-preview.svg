<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="50%" style="stop-color:#1A103D"/>
      <stop offset="100%" style="stop-color:#0D1117"/>
    </linearGradient>

    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(108,99,255,0.05)" stroke-width="1"/>
    </pattern>

    <!-- Code brackets icon -->
    <g id="bracket">
      <text font-family="'Fira Code', 'Courier New', monospace" font-size="14" fill="#6C63FF" opacity="0.6">{ }</text>
    </g>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accentGrad)"/>

  <!-- Large glowing orbs -->
  <circle cx="200" cy="320" r="180" fill="rgba(108,99,255,0.08)" filter="url(#softGlow)"/>
  <circle cx="1080" cy="320" r="200" fill="rgba(0,212,255,0.06)" filter="url(#softGlow)"/>
  <circle cx="640" cy="640" r="150" fill="rgba(108,99,255,0.05)" filter="url(#softGlow)"/>

  <!-- Decorative floating elements -->
  <g opacity="0.15">
    <!-- Top-right code brackets -->
    <text x="1120" y="80" font-family="'Fira Code', monospace" font-size="40" fill="#6C63FF" font-weight="bold">&lt;/&gt;</text>
    <!-- Bottom-left code brackets -->
    <text x="100" y="570" font-family="'Fira Code', monospace" font-size="50" fill="#00D4FF" font-weight="bold">{...}</text>
  </g>

  <!-- Small decorative dots/circles -->
  <circle cx="360" cy="120" r="4" fill="#6C63FF" opacity="0.4"/>
  <circle cx="920" cy="100" r="3" fill="#00D4FF" opacity="0.3"/>
  <circle cx="1050" cy="180" r="5" fill="#6C63FF" opacity="0.25"/>
  <circle cx="220" cy="500" r="3" fill="#00D4FF" opacity="0.35"/>
  <circle cx="500" cy="550" r="4" fill="#6C63FF" opacity="0.2"/>
  <circle cx="850" cy="520" r="3" fill="#00D4FF" opacity="0.3"/>

  <!-- Decorative diamond -->
  <rect x="115" y="140" width="16" height="16" rx="3" fill="none" stroke="#6C63FF" stroke-width="2" opacity="0.3" transform="rotate(45, 123, 148)"/>

  <!-- Small vertical accent bars -->
  <rect x="600" y="180" width="2" height="50" fill="url(#accentGrad)" rx="1" opacity="0.4"/>
  <rect x="610" y="195" width="2" height="35" fill="url(#accentGrad)" rx="1" opacity="0.3"/>
  <rect x="668" y="180" width="2" height="50" fill="url(#accentGrad)" rx="1" opacity="0.4"/>

  <!-- Main Content Area -->

  <!-- Avatar / Initial badge -->
  <circle cx="200" cy="260" r="65" fill="rgba(108,99,255,0.1)" stroke="url(#accentGrad)" stroke-width="3"/>
  <text x="200" y="280" font-family="'Segoe UI', Arial, sans-serif" font-size="48" fill="url(#accentGrad)" text-anchor="middle" font-weight="bold" dominant-baseline="middle">JK</text>

  <!-- Status indicator dot -->
  <circle cx="248" cy="308" r="8" fill="#22c55e" stroke="#0D1117" stroke-width="3"/>
  <text x="275" y="313" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#22c55e" opacity="0.8">Available for opportunities</text>

  <!-- Name -->
  <text x="280" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="1">
    Jana Karthik Siva Teja
  </text>

  <!-- Tagline with gradient -->
  <text x="280" y="300" font-family="'Fira Code', 'Courier New', monospace" font-size="24" fill="url(#accentGrad)" letter-spacing="1">
    Computer Science Undergraduate &amp; AI/ML Enthusiast
  </text>

  <!-- Separator line -->
  <line x1="280" y1="340" x2="580" y2="340" stroke="url(#accentGrad)" stroke-width="2" opacity="0.5"/>
  <circle cx="280" cy="340" r="3" fill="#6C63FF"/>
  <circle cx="580" cy="340" r="3" fill="#00D4FF"/>

  <!-- Tagline -->
  <text x="280" y="380" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#888888" letter-spacing="0.5">
    Building intelligent systems with code &amp; creativity
  </text>

  <!-- Tech Stack Badges Area -->
  <g transform="translate(280, 420)">
    <!-- Badge backgrounds -->
    <rect x="0" y="0" width="100" height="32" rx="16" fill="rgba(108,99,255,0.12)" stroke="rgba(108,99,255,0.2)" stroke-width="1"/>
    <text x="50" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#6C63FF" text-anchor="middle" font-weight="600">Java</text>

    <rect x="110" y="0" width="100" height="32" rx="16" fill="rgba(55,118,171,0.12)" stroke="rgba(55,118,171,0.2)" stroke-width="1"/>
    <text x="160" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#3776AB" text-anchor="middle" font-weight="600">Python</text>

    <rect x="220" y="0" width="110" height="32" rx="16" fill="rgba(97,218,251,0.12)" stroke="rgba(97,218,251,0.2)" stroke-width="1"/>
    <text x="275" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#61DAFB" text-anchor="middle" font-weight="600">React</text>

    <rect x="340" y="0" width="120" height="32" rx="16" fill="rgba(0,212,255,0.12)" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
    <text x="400" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#00D4FF" text-anchor="middle" font-weight="600">TypeScript</text>

    <rect x="0" y="42" width="130" height="32" rx="16" fill="rgba(255,111,0,0.12)" stroke="rgba(255,111,0,0.2)" stroke-width="1"/>
    <text x="65" y="64" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#FF6F00" text-anchor="middle" font-weight="600">TensorFlow</text>

    <rect x="140" y="42" width="120" height="32" rx="16" fill="rgba(0,150,136,0.12)" stroke="rgba(0,150,136,0.2)" stroke-width="1"/>
    <text x="200" y="64" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#009688" text-anchor="middle" font-weight="600">FastAPI</text>

    <rect x="270" y="42" width="130" height="32" rx="16" fill="rgba(109,179,63,0.12)" stroke="rgba(109,179,63,0.2)" stroke-width="1"/>
    <text x="335" y="64" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#6DB33F" text-anchor="middle" font-weight="600">Spring Boot</text>
  </g>

  <!-- Bottom-right decorative terminal window -->
  <g transform="translate(900, 480)">
    <rect x="0" y="0" width="320" height="120" rx="8" fill="rgba(13,17,23,0.6)" stroke="rgba(108,99,255,0.15)" stroke-width="1"/>
    <!-- Title bar dots -->
    <circle cx="20" cy="16" r="5" fill="#FF5F56"/>
    <circle cx="38" cy="16" r="5" fill="#FFBD2E"/>
    <circle cx="56" cy="16" r="5" fill="#27C93F"/>
    <text x="155" y="22" font-family="'Fira Code', monospace" font-size="10" fill="#888" text-anchor="middle">bash</text>
    <!-- Terminal content -->
    <text x="16" y="52" font-family="'Fira Code', monospace" font-size="13" fill="#22c55e">$</text>
    <text x="30" y="52" font-family="'Fira Code', monospace" font-size="13" fill="#00D4FF">cd /projects</text>
    <text x="16" y="74" font-family="'Fira Code', monospace" font-size="13" fill="#22c55e">$</text>
    <text x="30" y="74" font-family="'Fira Code', monospace" font-size="13" fill="#6C63FF">npm run build</text>
    <text x="16" y="96" font-family="'Fira Code', monospace" font-size="13" fill="#888888">✓ Build complete (2.3s)</text>
  </g>

  <!-- Bottom-left GitHub username -->
  <g transform="translate(40, 580)">
    <rect x="0" y="0" width="220" height="36" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- GitHub logo mini (octocat simplified) -->
    <circle cx="20" cy="18" r="7" fill="none" stroke="#888" stroke-width="1.5"/>
    <text x="38" y="24" font-family="'Fira Code', monospace" font-size="14" fill="#888">github.com/karthikJKST</text>
  </g>

  <!-- Bottom-right VIT-AP badge -->
  <g transform="translate(1010, 580)">
    <text x="0" y="16" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#555" text-anchor="end">VIT-AP • B.Tech CSE • 2022–2026</text>
  </g>
</svg>
